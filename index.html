<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Goddess Yulia</title>
<meta name="description" content="Goddess Yulia. 18+ only.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0807">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0807;--bone:#ece6dc;--mute:#9a9187;--ruby:#c3142b;--gold:#c8a665;--line:rgba(236,230,220,.2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:'Jost',system-ui,sans-serif;font-weight:300;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.bg{position:fixed;inset:-8%;background:url(img/yulia.jpg) center 30%/cover;filter:blur(26px) brightness(.38) saturate(1.1);transition:filter 1.2s ease,transform 1.2s ease;z-index:0}
body.in .bg{inset:0;filter:brightness(.42) saturate(1.05)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,8,7,.35),rgba(10,8,7,.9) 78%)}
main{position:relative;z-index:1;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(32px,env(safe-area-inset-top)) 20px max(32px,env(safe-area-inset-bottom));text-align:center}
.card{width:100%;max-width:400px}
h1{font-weight:200;font-size:clamp(30px,9vw,44px);letter-spacing:.16em;text-transform:uppercase;padding-left:.16em;line-height:1.1}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--gold);margin-top:10px}
.btn{display:block;width:100%;padding:16px 20px;border:1px solid var(--line);border-radius:2px;background:rgba(10,8,7,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--bone);font:inherit;font-weight:400;font-size:14px;letter-spacing:.22em;text-transform:uppercase;text-align:center;cursor:pointer;transition:border-color .25s,background .25s,transform .25s}
.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn.primary{background:var(--ruby);border-color:var(--ruby)}
.btn.primary:hover{background:#d8182f;border-color:#d8182f}
.stack{display:grid;gap:12px;margin-top:32px}
.small{margin-top:20px;color:var(--mute);font-size:13px;letter-spacing:.04em}
.small a{text-decoration:underline;text-underline-offset:3px}
#links{display:none}
body.in #gate{display:none}
body.in #links{display:block;animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.face{width:128px;height:128px;margin:0 auto 22px;border-radius:50%;border:1px solid var(--gold);background:url(img/yulia.jpg) 42% 30%/cover}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<main>
  <section class="card" id="gate">
    <h1>Goddess Yulia</h1>
    <p class="sub">adults only</p>
    <div class="stack">
      <button class="btn primary" id="enter" type="button">I am 18 or older</button>
      <a class="btn" href="https://www.google.com" rel="noopener">Leave</a>
    </div>
    <p class="small">By entering u confirm u are of legal age in ur country.</p>
  </section>

  <section class="card" id="links">
    <div class="face" role="img" aria-label="Goddess Yulia"></div>
    <h1>Goddess Yulia</h1>
    <p class="sub">make urself useful</p>
    <div class="stack">
      <a class="btn primary" id="x" href="https://x.com/GoddessYlia" rel="noopener">Follow Me on X</a>
      <a class="btn" id="lf" href="https://www.loyalfans.com/findomYulia" rel="noopener">LoyalFans</a>
    </div>
    <p class="small">18+ only</p>
  </section>
</main>
<script>
(function(){
  var b=document.body,K='yulia18';
  function enter(){b.classList.add('in');try{localStorage.setItem(K,'1')}catch(e){}}
  try{if(localStorage.getItem(K)==='1')b.classList.add('in')}catch(e){}
  document.getElementById('enter').addEventListener('click',enter);
})();
</script>
</body>
</html>
